[package]
name = "wdttg"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
rusqlite = { version = "0.39", features = ["backup"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
dirs = "5"
ratatui = "0.27"
crossterm = "0.28"
fuzzy-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "=1.12.0"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
