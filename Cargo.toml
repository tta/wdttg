[package]
name = "wdttg"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.39", features = ["backup"] }
chrono = { version = "0.4", features = ["serde"] }
